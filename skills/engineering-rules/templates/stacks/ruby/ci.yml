# Stack gates for Ruby (Rails, gems).
# Copy to .github/workflows/stack-ruby.yml (the installer does this for you).
# Runs scripts/stack-gates.sh: deps, format, lint, types, test, build, audit.
# Which gates must pass is set in .github/engineering-rules.env (profile).
# The same command runs on your machine:  bash .github/scripts/stack-gates.sh
name: stack-ruby

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stack-ruby-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A docs-only pull request skips the heavy steps but the check still reports,
      # so the required check never hangs. The default branch always runs everything.
      - id: scope
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"
      - id: gate
        env:
          RUN: ${{ github.event_name != 'pull_request' || steps.scope.outputs.code == 'true' }}
        run: echo "run=${RUN}" >> "$GITHUB_OUTPUT"
      - name: Setup Ruby
        if: steps.gate.outputs.run == 'true'
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
      # bundler-audit: add the gem to your Gemfile (group :development) so `bundle exec bundle-audit` exists.
      - name: Stack gates
        if: steps.gate.outputs.run == 'true'
        run: bash .github/scripts/stack-gates.sh --root . --engine ruby
