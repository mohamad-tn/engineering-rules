# Stack gates for Terraform and OpenTofu.
# Copy to .github/workflows/stack-terraform.yml (the installer does this for you).
# Runs scripts/stack-gates.sh: deps, format, lint, types, test, build, audit.
# Which gates must pass is set in .github/engineering-rules.env (profile).
# The same command runs on your machine:  bash .github/scripts/stack-gates.sh
name: stack-terraform

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stack-terraform-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A docs-only pull request skips the heavy steps but the check still reports,
      # so the required check never hangs. The default branch always runs everything.
      - id: scope
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"
      - id: gate
        env:
          RUN: ${{ github.event_name != 'pull_request' || steps.scope.outputs.code == 'true' }}
        run: echo "run=${RUN}" >> "$GITHUB_OUTPUT"
      - name: Install OpenTofu (pinned, checksum-verified)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          bash .github/scripts/install-release-tool.sh \
            https://github.com/opentofu/opentofu/releases/download/v1.13.9/tofu_1.13.9_linux_amd64.zip \
            bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce tofu "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Using HashiCorp Terraform instead? Use the hashicorp/setup-terraform action pinned to a commit SHA.
      - name: Stack gates
        if: steps.gate.outputs.run == 'true'
        run: bash .github/scripts/stack-gates.sh --root . --engine terraform
